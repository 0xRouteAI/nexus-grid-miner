# NEXUS GRID miner node: one GPU, one model.
#
#   1) once, download the model weights:
#      docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml up -d
#      docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml logs -f
#      (wait for "Ready", then)
#      docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml down
#   2) run:
#      docker compose up -d --build
#
# .env chooses the model with COMPOSE_PROFILES (bge-m3 or bge-reranker-v2-m3):
# only that model's inference container starts. TEI_IMAGE must match the GPU.
# Only the agent can reach the internet; the inference container sits on an
# internal-only network and no port is published.
services:
  agent:
    build:
      context: .
      dockerfile: agent-go/Dockerfile
    image: nexus-grid-miner-agent:latest
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      # The profile that starts the inference container is also the model the
      # agent serves, so the two can never disagree.
      MODEL: "${COMPOSE_PROFILES:?Set COMPOSE_PROFILES in .env to bge-m3 or bge-reranker-v2-m3}"
      TEI_URL: "http://embeddings:80"
      RERANK_URL: "http://reranker:80"
      # nvidia-smi inside the agent needs the driver's utility capability.
      NVIDIA_DRIVER_CAPABILITIES: "utility"
    depends_on:
      embeddings:
        condition: service_started
        required: false
      reranker:
        condition: service_started
        required: false
    # Lets SERVER_URL=http://host.docker.internal:<port> reach a server running
    # on this same machine. Harmless otherwise.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inference
      - egress
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]

  embeddings:
    profiles: ["bge-m3"]
    # The TEI build must match the GPU generation; pin the tag (better: the digest).
    image: "${TEI_IMAGE:?Set TEI_IMAGE in .env for your GPU (see README)}"
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]
    environment:
      HUGGINGFACE_HUB_CACHE: "/data/huggingface"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
    volumes:
      - model-cache:/data
    networks:
      - inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]

  reranker:
    profiles: ["bge-reranker-v2-m3"]
    image: "${TEI_IMAGE:?Set TEI_IMAGE in .env for your GPU (see README)}"
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80"]
    environment:
      HUGGINGFACE_HUB_CACHE: "/data/huggingface"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
    volumes:
      - model-cache:/data
    networks:
      - inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]

networks:
  # No default gateway: the inference container cannot reach the internet.
  inference:
    internal: true
  # Outbound access for the agent only.
  egress:
    driver: bridge

volumes:
  # Shared by every node on this machine, so each model downloads once.
  model-cache:
    name: nexus-model-cache
