# One-time model download. The inference container normally has no internet
# access; this override attaches it to the egress network, turns off offline
# mode, and keeps the agent from starting.
#
#   docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml logs -f
#   docker compose -f docker-compose.yml -f docker-compose.bootstrap.yml down
#
# Do not use this file for normal running.
services:
  agent:
    profiles: ["bootstrap-disabled"]
  embeddings:
    environment:
      HF_HUB_OFFLINE: "0"
    networks:
      - inference
      - egress
  reranker:
    environment:
      HF_HUB_OFFLINE: "0"
    networks:
      - inference
      - egress
